<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'">
    <title>To-Do</title>
</head>
<body>
    <header class="header">
        <h1 class="heading_header">To-Do Application</h1>
    </header>
    <main class="main">
        <section class="add-element">
            <form id="task-form">
                <input type="text" name="task" id="task" placeholder="Add a task">
                <input type="submit" value="Add">
            </form>
        </section>
        <div class="element-list">
            <ul id="list">
                <li>Buy Some Milk</li>
            </ul>
        </div>

    </main>
    <footer class="footer">
        <p>&copy;To-Do Application</p>
    </footer>
    <script src="../js/renderer.js"></script>
</body>
</html>
